name: Security

on:
  push:
    branches: [master]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.1
          sha256: 961b1fcc78830e861ab887abd19d9b961478bcf252e37881fdd61c81388308d4
          install: false
          cache: true

      - name: Install locked dependencies
        run: |
          mise install --locked
          pnpm install --frozen-lockfile

      - name: Audit dependency advisories
        run: pnpm audit

      - name: Verify registry signatures
        run: pnpm audit signatures

  repository:
    name: Repository vulnerabilities and misconfiguration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          format: table
          version: v0.73.0
          skip-dirs: .git,node_modules
