name: Security reports

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency report and integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.1
          sha256: 961b1fcc78830e861ab887abd19d9b961478bcf252e37881fdd61c81388308d4
          install: false
          cache: true

      - name: Install locked dependencies
        run: |
          mise install --locked node npm:pnpm
          pnpm install --frozen-lockfile

      - name: Report dependency advisories
        run: pnpm exec tsx scripts/dependency-report.ts

      - name: Verify registry signatures
        run: pnpm audit signatures

  repository:
    permissions:
      contents: read
      security-events: write
    name: Repository vulnerabilities and misconfiguration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0
          format: sarif
          output: trivy-results.sarif
          limit-severities-for-sarif: true
          version: v0.73.0
          skip-dirs: .git,node_modules

      - name: Publish code scanning alerts
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: trivy-results.sarif
          category: scheduled-trivy
